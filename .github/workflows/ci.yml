name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source boundaries
        run: scripts/check-repo-safety.sh
      - name: Test source-boundary failures
        run: python3 tests/host/test_repo_safety.py
      - name: Run host tests without game data
        run: RINGPAD_APPLE_DEVELOPER_DIR="$(xcode-select -p)" scripts/run-host-tests.sh
